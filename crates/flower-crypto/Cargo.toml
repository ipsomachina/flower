[package]
name = "flower-crypto"
version = "0.0.20261105"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Flower crypto lane: hashing, versioned AEAD envelopes, guest NaCl/JOSE/WebAuthn and managed keys"

[dependencies]
flower-sdk = { version = "0.0.20261105", path = "../flower-sdk" }
sha2 = "0.10"
aes-gcm = "0.10"
ed25519-dalek = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Guest NaCl, JOSE and WebAuthn plus the managed-key catalog: v1's crates.
anyhow = "1"
aws-lc-rs = "1.18.1"
base64 = "0.23.1"
crypto_secretbox = { version = "0.1.1", default-features = false, features = ["salsa20"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
p256 = { version = "0.14.0", default-features = false, features = ["std", "ecdsa", "pem", "precomputed-tables"] }
pem = "3.0.6"
subtle = "2.6.1"
x25519-dalek = "2"
zeroize = "1.9.0"

[lints]
workspace = true
