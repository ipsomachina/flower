[package]
name = "flower-engine"
version = "0.0.20261105"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Single-node engine core for Flower: storage, execution and local evaluation"

[dependencies]
flower-sql = { version = "0.0.20261105", path = "../flower-sql" }
flower-protocol = { version = "0.0.20261105", path = "../flower-protocol" }
# Overlays (im), backups (zstd) and crypto land with their layers.
# Explicit fork identity survives packaging: upstream 4.4.0 plus bounded
# online compaction (vendor/redb/FLOWER.md), locally and from crates.io.
redb = { package = "flower-redb", version = "=4.4.0-flower.1" }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
# Host/guest codecs, schemas, descriptors and envelopes.
flower-sdk = { version = "0.0.20261105", path = "../flower-sdk", features = ["native-host"] }
# Canonical-JSON text parsing (engine side only; the guest stays parser-free).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Queue item IDs and claim tokens.
rand = "0.9"
# Guest execution. Only the runtime, the Cranelift compiler with its
# in-memory incremental cache, and the pooling instance allocator: no
# async, GC, component model or on-disk cache.
wasmtime = { version = "=49.0.0", default-features = false, features = ["std", "cranelift", "runtime", "pooling-allocator", "incremental-cache"] }
# Initialized images: read a guest module and write it back with the
# state `flower_init` left as its initial state (the versions Wasmtime
# itself resolves, so no new crates).
wasmparser = { version = "0.258", default-features = false, features = ["std", "simd"] }
wasm-encoder = { version = "0.258", default-features = false, features = ["std"] }
# Receipt owners: unscoped idempotency receipts record SHA-256 over the
# principal's subject and tenant (the same crate flower-crypto uses).
sha2 = "0.10"

[dev-dependencies]
flower-crypto = { path = "../flower-crypto" }
tempfile = "3"

[lints]
workspace = true
