[package]
license.workspace = true
name = "doc-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The guests, for their typed descriptors and argument structs.
tasks = { path = "../quickstart" }
doc-snippets = { path = "../snippets" }
flower-client = { path = "../../../../crates/flower-client", features = ["conformance"] }
flower-sdk = { path = "../../../../crates/flower-sdk" }
flower-worker = { path = "../../../../crates/flower-worker", features = ["testing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
